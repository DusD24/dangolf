<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#182433">
  <title>Dangolf · Practice Tee</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./tee.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main id="practice">
    <canvas id="tee" aria-label="Practice tee. Draw a rune, pull down, then swipe up and lift. Tap at contact for a bonus." aria-describedby="prompt"></canvas>
    <header class="masthead">
      <div class="brand">
        <p class="eyebrow"><span aria-hidden="true">✦</span> <span id="course-name">Wizard golf</span></p>
        <h1>Dangolf</h1>
      </div>
      <dl class="stats" aria-label="Shot stats">
        <div><dt>Load</dt><dd id="load">—</dd></div>
        <div><dt>Carry</dt><dd id="carry">—</dd></div>
        <div><dt>Total</dt><dd id="distance">—</dd></div>
        <div id="pin-stat" hidden><dt>To pin</dt><dd id="to-pin">—</dd></div>
      </dl>
      <p id="hole-info" class="eyebrow" hidden></p>
      <div class="instructions">
        <p class="eyebrow" id="phase" role="status">Practice tee</p>
        <p id="prompt">Start at the gold dot. Trace, pull, then swipe up.</p>
      </div>
    </header>
    <footer class="thumb-controls" aria-label="Game controls">
      <div class="choices">
        <div class="spell-tools">
          <select id="spell-mode" aria-label="Spell difficulty">
            <option value="guided">Guided</option>
            <option value="hard">Hard</option>
          </select>
          <select id="rune-guide" aria-label="Rune to trace">
            <option value="crescent-right">Crescent →</option>
            <option value="crescent-left">Crescent ←</option>
            <option value="sword">Sword</option>
            <option value="star">Five-point star</option>
          </select>
        </div>
        <select id="club-choice" aria-label="Club" hidden>
          <option value="driver">Driver</option>
          <option value="wedge">Wedge</option>
          <option value="pitch">Pitch</option>
          <option value="putter">Putter</option>
        </select>
      </div>
      <div class="actions">
        <button id="hole-map" type="button" hidden>Aim / Map</button>
        <button id="scorecard" type="button" hidden>Scorecard</button>
        <button id="play-course" type="button">Play 9</button>
        <button id="reset" type="button"><span aria-hidden="true">↺</span> Reset</button>
        <button id="round-next" type="button" hidden>Play next shot</button>
      </div>
    </footer>
    <dialog id="round-dialog" aria-labelledby="dialog-title">
      <div class="dialog-heading">
        <h2 id="dialog-title"></h2>
        <form method="dialog"><button aria-label="Close" value="close">Close</button></form>
      </div>
      <section id="map-content" hidden>
        <p id="map-tip"></p>
        <canvas id="map-canvas" width="360" height="420" aria-label="Overhead hole map. Tap a target to aim."></canvas>
        <div class="map-legend"><span>● Ball</span><span>● Pin</span><span>● Water</span><span>● Bunker</span></div>
        <button id="aim-at-pin" type="button">Aim at the pin</button>
      </section>
      <section id="card-content" hidden>
        <table>
          <thead><tr><th scope="col">Hole</th><th scope="col">Par</th><th scope="col">Yards</th><th scope="col">Strokes</th></tr></thead>
          <tbody id="card-rows"></tbody>
          <tfoot><tr><th scope="row">Total</th><td id="card-par"></td><td id="card-yards"></td><td id="card-strokes"></td></tr></tfoot>
        </table>
        <p id="card-total"></p>
      </section>
    </dialog>
  </main>
</body>
</html>
